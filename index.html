    h += '<div class="tq" data-tq="'+qid+'"><div class="meta"><span>Q'+(i+1)+" of "+b.items.length+"</span><span>"+esc(it.cat)+"</span></div>"+
      '<p class="q">'+inl(it.q)+"</p>"+(it.code?codeBlock(it.code):"")+
      revealable(qid,"Reveal answer",part("✅","Answer",fmt(it.a))+(it.ex?part("🔍","Explanation",fmt(it.ex)):"")+hook(it.hook),{grade:true})+"</div>";
  });
  return h;
};
R.rev = (b) => '<div class="rev"><h3>'+inl(b.title)+"</h3>"+fmt(b.text)+(b.code?codeBlock(b.code):"")+"</div>";
R.hooks = (b) => (b.title?'<h3 style="margin-top:26px">'+inl(b.title)+"</h3>":"")+'<div class="hooks">'+b.items.map(x=>'<div><span class="hl">'+inl(x)+"</span></div>").join("")+"</div>";
R.prio = (b) => '<div class="prio-grid">'+b.groups.map(g=>'<div class="pg"><h3><span class="dot '+PRI[g.p][0]+'" style="width:11px;height:11px;border-radius:50%;display:inline-block"></span>'+inl(g.title)+"</h3><ul>"+g.items.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ul></div>").join("")+"</div>";
R.map = () => {
  const col = (sec,t,items)=>'<a class="map-col" href="#'+sec+'"><b>'+t+"</b><span>"+items+"</span></a>";
  return '<div class="map"><button class="map-root" data-go="fundamentals">JAVASCRIPT</button><div class="map-stem"></div><div class="map-row">'+
    col("fundamentals","Language","Variables · scope · types · functions · objects · prototypes · arrays")+
    col("async","Async","Call stack · event loop · promises · microtasks · async/await")+
    col("dom","Browser","DOM · events · storage · fetch · CORS · observers")+
    '</div><div class="map-foot"><div class="map-stem"></div><a href="#senior"><b>Frontend engineering</b><span>Performance · memory · API handling · UI interactions</span></a>'+
    '<div class="map-links"><a class="btn small" href="#functions">Functions &amp; objects</a><a class="btn small" href="#arrays">Array methods</a><a class="btn small" href="#traps">Traps</a><a class="btn small" href="#coding">Coding</a><a class="btn small" href="#test">Final test</a><a class="btn small" href="#revision">30-min revision</a></div></div></div>';
};
R.eventloop = () => '<div class="el" id="elw"><div class="el-top"><label for="elsel" style="font-size:.88rem;font-weight:600">Scenario</label><select id="elsel"></select>'+
  '<button class="btn small" id="elprev">Back</button><button class="btn small primary" id="elnext">Step</button><button class="btn small ghost" id="elreset">Reset</button><span id="elcount" style="font-size:.82rem;color:var(--muted)"></span></div>'+
  '<div class="el-grid"><div class="el-code" id="elcode"></div><div class="el-boxes">'+
  '<div class="el-box"><h4>Call stack</h4><div id="el-stack"></div></div><div class="el-box"><h4>Web APIs (timers, fetch)</h4><div id="el-web"></div></div>'+
  '<div class="el-box"><h4>Microtask queue</h4><div id="el-micro"></div></div><div class="el-box"><h4>Macrotask queue</h4><div id="el-macro"></div></div>'+
  '<div class="el-box console"><h4>Console</h4><div id="el-out"></div></div></div></div><div class="el-note" id="elnote"></div></div>';
R.bubbling = () => '<div class="bub"><h3 style="font-size:1.05rem;margin-bottom:4px">🖱️ Try it: click the inner box</h3><p style="margin:0;color:var(--muted);font-size:.9rem">Real listeners are attached below. Toggle options and watch the order.</p>'+
  '<div class="bub-opts"><label><input type="checkbox" id="bubCap"> Add capture listeners</label><label><input type="checkbox" id="bubStop"> stopPropagation() on middle</label><button class="btn small ghost" id="bubClear">Clear log</button></div>'+
  '<div class="bub-area"><div class="bx" id="bubOuter"><span class="nm">div#outer</span><div class="bx" id="bubMiddle"><span class="nm">div#middle</span><div class="bx" id="bubInner"><span class="nm">button#inner</span>Click me</div></div></div>'+
  '<div class="bub-log" id="bubLog" aria-live="polite">Log appears here</div></div></div>';
R.debounce = () => '<div class="dt"><h3 style="font-size:1.05rem;margin-bottom:6px">⌨️ Try it: type fast in the box</h3><input id="dtIn" placeholder="Type quickly, then pause" aria-label="Debounce demo input">'+
  '<div class="dt-rows"><div class="dt-row"><span>Raw events</span><div class="dt-track" id="dtRaw"></div><b id="dtRawN">0</b></div>'+
  '<div class="dt-row"><span>Debounced 400ms</span><div class="dt-track" id="dtDeb"></div><b id="dtDebN">0</b></div>'+
  '<div class="dt-row"><span>Throttled 400ms</span><div class="dt-track" id="dtThr"></div><b id="dtThrN">0</b></div></div>'+
  '<p style="margin:10px 0 0;font-size:.88rem;color:var(--muted)">Debounce fires once after you stop. Throttle fires at most once every 400ms while you type.</p></div>';

function card(id, title, hookline, badges, body, open){
  const isOpen = open || S.rev["open:"+id];
  return '<div class="card'+(isOpen?" open":"")+'" data-card="'+id+'"><button class="head" aria-expanded="'+(isOpen?"true":"false")+'">'+CHEV+
    '<h3>'+inl(title)+(hookline?'<span class="hookline">'+inl(hookline)+"</span>":"")+"</h3>"+(badges||"")+'</button><div class="body">'+body+"</div></div>";
}

/* ---------- progress ---------- */
function idsFor(sec){
  const ids = [];
  sec.blocks.forEach((b,i)=>{
    const id = sec.id+":"+i;
    if (["concept","senior","predict","explain","problem"].includes(b.t)) ids.push(id);
    if (b.t==="recall") b.items.forEach((_,j)=>ids.push(id+"."+j));
    if (b.t==="test") b.items.forEach((_,j)=>ids.push(id+"."+j));
  });
  return ids;
}
function secPct(sec){
  if (S.done[sec.id]) return 100;
  const ids = idsFor(sec); if(!ids.length) return 0;
  return Math.round(100*ids.filter(x=>S.rev[x]).length/ids.length);
}
function updateNav(){
  let tot = 0;
  C.forEach(sec=>{ const p = secPct(sec); tot += p; const el = document.querySelector('[data-mini="'+sec.id+'"]'); if (el) el.style.width = p+"%"; });
  const ov = Math.round(tot/C.length);
  document.getElementById("ovBar").style.width = ov+"%";
  document.getElementById("ovTxt").textContent = ov+"% of the course";
  updateScore();
}
function updateScore(){
  const sb = document.getElementById("scorebar"); if(!sb) return;
  const sec = C.find(s=>s.id==="test"); const ids = idsFor(sec);
  const y = ids.filter(x=>S.grade[x]==="y").length, n = ids.filter(x=>S.grade[x]==="n").length;
  const filt = sb.dataset.f || "all";
  sb.innerHTML = '<span><b>'+y+"</b> got it</span><span><b>"+n+"</b> missed</span><span><b>"+(ids.length-y-n)+"</b> left</span>"+
    '<span style="flex:1"></span><button class="btn small'+(filt==="all"?" primary":"")+'" data-filter="all">All</button><button class="btn small'+(filt==="missed"?" primary":"")+'" data-filter="missed">Missed only</button><button class="btn small'+(filt==="left"?" primary":"")+'" data-filter="left">Not attempted</button>';
  document.querySelectorAll("[data-tq]").forEach(el=>{
    const g = S.grade[el.dataset.tq];
    el.classList.toggle("hide", (filt==="missed" && g!=="n") || (filt==="left" && !!g));
  });
}

/* ---------- nav + render ---------- */
function buildNav(){
  let h = "", grp = null;
  C.forEach(sec=>{
    if (sec.group && sec.group!==grp){ grp = sec.group; h += '<li class="group">'+esc(grp)+"</li>"; }
    h += '<li><a href="#'+sec.id+'" data-nav="'+sec.id+'"><span class="dot '+PRI[sec.pri||"blue"][0]+'"></span><span>'+esc(sec.icon+" "+sec.title)+'</span><span class="mini"><i data-mini="'+sec.id+'"></i></span></a></li>';
  });
  document.getElementById("nav").innerHTML = h;
}
function render(){
  const hid = (location.hash||"").slice(1);
  const idx = Math.max(0, C.findIndex(s=>s.id===hid));
  const sec = C[idx];
  let h = '<div class="sec-head"><div class="tag">'+prio(sec.pri)+'</div><h2>'+esc(sec.icon+" "+sec.title)+"</h2>"+(sec.lede?'<div class="lede">'+fmt(sec.lede)+"</div>":"")+"</div>";
  const hasCards = sec.blocks.some(b=>["concept","senior","explain","problem"].includes(b.t));
  if (hasCards) h += '<div style="display:flex;gap:8px;margin-bottom:6px"><button class="btn small" data-all="open">Expand all</button><button class="btn small" data-all="close">Collapse all</button></div>';
  sec.blocks.forEach((b,i)=>{ h += R[b.t](b, sec.id+":"+i); });
  h += '<div class="done-row"><button class="btn'+(S.done[sec.id]?" primary":"")+'" data-done="'+sec.id+'">'+(S.done[sec.id]?"Section completed":"Mark section as completed")+"</button></div>";
  h += '<div class="pnav">'+(idx>0?'<a class="btn" href="#'+C[idx-1].id+'">Previous: '+esc(C[idx-1].title)+"</a>":"<span></span>")+
       (idx<C.length-1?'<a class="btn primary" href="#'+C[idx+1].id+'">Next: '+esc(C[idx+1].title)+"</a>":"")+"</div>";
  document.getElementById("content").innerHTML = h;
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",false));
  const cur = document.querySelector('[data-nav="'+sec.id+'"]'); if (cur) cur.setAttribute("aria-current","page");
  document.title = sec.title+" | JS UI Interview Masterclass";
  if (document.getElementById("elw")) initEL();
  if (document.getElementById("bubInner")) initBub();
  if (document.getElementById("dtIn")) initDT();
  updateNav();
  window.scrollTo(0,0);
  document.getElementById("side").classList.remove("open");
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  const rv = t.closest("[data-reveal]");
  if (rv){ const id = rv.dataset.reveal, a = document.getElementById("ans-"+id), on = !a.classList.contains("show");
    a.classList.toggle("show", on); rv.textContent = on ? "Hide answer" : rv.dataset.label || "Reveal answer"; rv.setAttribute("aria-expanded", on);
    if (on) S.rev[id] = true; save(); updateNav(); return; }
  const gr = t.closest("[data-grade]");
  if (gr){ const id = gr.dataset.grade; S.grade[id] = gr.dataset.v; S.rev[id] = true; save();
    gr.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on-y","on-n")); gr.classList.add(gr.dataset.v==="y"?"on-y":"on-n"); updateNav(); return; }
  const hd = t.closest(".card>.head");
  if (hd){ const c = hd.parentElement, on = !c.classList.contains("open"); c.classList.toggle("open", on); hd.setAttribute("aria-expanded", on); S.rev["open:"+c.dataset.card] = on || undefined; save(); return; }
  const all = t.closest("[data-all]");
  if (all){ const on = all.dataset.all==="open"; document.querySelectorAll(".card").forEach(c=>{c.classList.toggle("open",on); c.querySelector(".head").setAttribute("aria-expanded",on)}); return; }
  const dn = t.closest("[data-done]");
  if (dn){ const id = dn.dataset.done; S.done[id] = !S.done[id]; save(); dn.classList.toggle("primary", S.done[id]); dn.textContent = S.done[id]?"Section completed":"Mark section as completed"; updateNav(); return; }
  const cp = t.closest("[data-copy]");
  if (cp){ const txt = cp.previousElementSibling.textContent; (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{cp.textContent="Copied"; setTimeout(()=>cp.textContent="Copy",1200)}).catch(()=>{cp.textContent="Select and copy"}); return; }
  const fl = t.closest("[data-filter]");
  if (fl){ document.getElementById("scorebar").dataset.f = fl.dataset.filter; updateScore(); return; }
  const go = t.closest("[data-go]");
  if (go){ location.hash = go.dataset.go; return; }
});
document.addEventListener("click", e=>{ const rv = e.target.closest("[data-reveal]"); if(rv && !rv.dataset.label){} }, true);
document.getElementById("menuBtn").addEventListener("click", ()=>document.getElementById("side").classList.toggle("open"));
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try{localStorage.setItem("jsim-theme", r.dataset.theme)}catch(e){}
});
document.getElementById("resetBtn").addEventListener("click", ()=>{ if (confirm("Reset all progress and test scores?")){ S = {rev:{},grade:{},done:{}}; save(); render(); } });
try{ const th = localStorage.getItem("jsim-theme"); if (th) document.documentElement.dataset.theme = th; }catch(e){}
// remember original reveal labels
const obs = new MutationObserver(()=>document.querySelectorAll("[data-reveal]:not([data-label])").forEach(b=>{ b.dataset.label = b.textContent==="Hide answer" ? "Reveal answer" : b.textContent; }));
obs.observe(document.getElementById("content"), {childList:true, subtree:true});
window.addEventListener("hashchange", render);

/* ---------- event loop widget ---------- */
function initEL(){
  const SC = window.EL_SCENARIOS, sel = document.getElementById("elsel");
  sel.innerHTML = SC.map((s,i)=>'<option value="'+i+'">'+esc(s.name)+"</option>").join("");
  let si = 0, st = 0;
  function draw(){
    const sc = SC[si], step = sc.steps[st], lines = sc.code.split("\n");
    document.getElementById("elcode").innerHTML = '<pre class="code"><code>'+lines.map((l,i)=>'<span class="'+(step.line===i+1?"line-on":"")+'">'+hl(l)+"</span>").join("\n")+"</code></pre>";
    const chips = (arr,cls)=>(arr||[]).map(x=>'<span class="chip '+cls+'">'+esc(x)+"</span>").join("") || '<span style="color:var(--muted);font-size:.78rem">empty</span>';
    document.getElementById("el-stack").innerHTML = chips(step.stack,"stack");
    document.getElementById("el-web").innerHTML = chips(step.web,"");
    document.getElementById("el-micro").innerHTML = chips(step.micro,"micro");
    document.getElementById("el-macro").innerHTML = chips(step.macro,"macro");
    document.getElementById("el-out").innerHTML = chips(step.out,"out");
    document.getElementById("elnote").innerHTML = inl(step.note);
    document.getElementById("elcount").textContent = "Step "+(st+1)+" of "+sc.steps.length;
    document.getElementById("elprev").disabled = st===0; document.getElementById("elnext").disabled = st===sc.steps.length-1;
  }
  sel.onchange = ()=>{ si = +sel.value; st = 0; draw(); };
  document.getElementById("elnext").onclick = ()=>{ if (st<SC[si].steps.length-1){st++; draw();} };
  document.getElementById("elprev").onclick = ()=>{ if (st>0){st--; draw();} };
  document.getElementById("elreset").onclick = ()=>{ st = 0; draw(); };
  draw();
}
/* ---------- bubbling widget ---------- */
function initBub(){
  const o = document.getElementById("bubOuter"), m = document.getElementById("bubMiddle"), n = document.getElementById("bubInner"), log = document.getElementById("bubLog");
  let lines = [], seq = 0;
  function add(txt, el){ lines.push(txt); log.innerHTML = lines.map((l,i)=>(i+1)+". "+esc(l)).join("<br>"); const d = (seq++)*220; setTimeout(()=>{el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),200)}, d); }
  const cap = document.getElementById("bubCap"), stop = document.getElementById("bubStop");
  [[o,"outer"],[m,"middle"],[n,"inner"]].forEach(([el,name])=>{
    el.addEventListener("click", e=>{ if(cap.checked) add("CAPTURE  "+name+(e.eventPhase===2?" (target)":""), el); }, true);
    el.addEventListener("click", e=>{ add("BUBBLE   "+name+(e.eventPhase===2?" (target)":""), el); if (name==="middle" && stop.checked){ e.stopPropagation(); lines.push("   stopPropagation(): outer never hears it"); log.innerHTML = lines.map((l,i)=>(i+1)+". "+esc(l)).join("<br>"); } });
  });
  n.addEventListener("click", ()=>{ }, false);
  document.addEventListener("click", e=>{ if (e.target.closest("#bubInner") && lines.length===0){} }, true);
  n.addEventListener("pointerdown", ()=>{ lines = []; seq = 0; });
  document.getElementById("bubClear").onclick = ()=>{ lines = []; log.textContent = "Log appears here"; };
}
/* ---------- debounce widget ---------- */
function initDT(){
  const inp = document.getElementById("dtIn"); const t0 = {v:null}; let raw=0, deb=0, thr=0, dT=null, last=0;
  function mark(track, cnt, id){ if(t0.v===null) t0.v = performance.now(); const x = Math.min(99, (performance.now()-t0.v)/80); const i = document.createElement("i"); i.style.left = x+"%"; document.getElementById(track).appendChild(i); document.getElementById(id).textContent = cnt; }
  inp.addEventListener("input", ()=>{
    if (t0.v!==null && performance.now()-t0.v>8000){ ["dtRaw","dtDeb","dtThr"].forEach(x=>document.getElementById(x).innerHTML=""); t0.v=null; raw=deb=thr=0; }
    raw++; mark("dtRaw", raw, "dtRawN");
    clearTimeout(dT); dT = setTimeout(()=>{ deb++; mark("dtDeb", deb, "dtDebN"); }, 400);
    const now = performance.now(); if (now-last>=400){ last = now; thr++; mark("dtThr", thr, "dtThrN"); }
  });
}

buildNav(); render();
})();

</script>
</body></html>
