<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JS UI Interview Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAEFF2; --sheet:#FFFFFF; --sheet2:#F5F8FA; --ink:#1B2A38; --muted:#56687A; --rule:#D2DBE2;
  --hl:#F6DC45; --hl-ink:#1B2A38; --red:#B8372F; --red-bg:#FBEDEB; --green:#25704F; --green-bg:#E7F4EC;
  --blue:#245B92; --blue-bg:#E6EEF7; --amber:#A25B00; --amber-bg:#FCF1E0; --code-bg:#17222D; --code-ink:#E3EAF0;
  --k:#F6DC45; --s:#9FD7A8; --c:#7F93A6; --n:#F2A97F; --grid:rgba(36,91,146,.06);
  --r1:4px; --r2:10px; --shadow:0 1px 0 var(--rule);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141B22; --sheet:#1C252F; --sheet2:#222D38; --ink:#E3E9EE; --muted:#9AAAB8; --rule:#2F3C49;
    --red:#F08A80; --red-bg:#3A2225; --green:#7ED3A3; --green-bg:#1E3329; --blue:#8EB8E6; --blue-bg:#1F2E40;
    --amber:#F0B868; --amber-bg:#372B1B; --code-bg:#0F161D; --grid:rgba(142,184,230,.05);
  }
}
:root[data-theme="dark"]{
  --paper:#141B22; --sheet:#1C252F; --sheet2:#222D38; --ink:#E3E9EE; --muted:#9AAAB8; --rule:#2F3C49;
  --red:#F08A80; --red-bg:#3A2225; --green:#7ED3A3; --green-bg:#1E3329; --blue:#8EB8E6; --blue-bg:#1F2E40;
  --amber:#F0B868; --amber-bg:#372B1B; --code-bg:#0F161D; --grid:rgba(142,184,230,.05);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;line-height:1.2;margin:0}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
img,svg{max-width:100%}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;background:var(--sheet);border-right:1px solid var(--rule);padding:22px 14px 28px}
.brand{padding:0 8px 16px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.85rem;line-height:1.4}
.overall{margin:12px 8px 6px;font-size:.82rem;color:var(--muted)}
.bar{height:6px;background:var(--sheet2);border-radius:3px;overflow:hidden;border:1px solid var(--rule)}
.bar>i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.nav{list-style:none;margin:10px 0 0;padding:0}
.nav a{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start;padding:8px 8px;border-radius:var(--r1);text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.3}
.nav a:hover{background:var(--sheet2)}
.nav a[aria-current="page"]{background:var(--blue-bg);color:var(--blue);font-weight:600}
.nav .dot{width:10px;height:10px;border-radius:50%;margin-top:4px}
.nav .mini{grid-column:2;height:3px;background:var(--sheet2);border-radius:2px;overflow:hidden;margin-top:5px}
.nav .mini i{display:block;height:100%;background:var(--green);width:0}
.nav .group{font-size:.78rem;color:var(--muted);padding:14px 8px 4px;font-weight:600}
.p-red{background:#D9483E}.p-orange{background:#E8892B}.p-yellow{background:#E6C220}.p-white{background:#B7C2CC}.p-blue{background:var(--blue)}
.side-tools{display:flex;gap:8px;margin:16px 8px 0;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:7px 12px;border-radius:var(--r1);font-size:.88rem}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:.8rem}

.topbar{display:none}
.main{min-width:0;padding:34px clamp(16px,4vw,48px) 80px}
.wrap{max-width:860px;margin:0 auto}
.sec-head{margin-bottom:22px}
.sec-head .tag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:8px}
.sec-head h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;letter-spacing:-.02em}
.sec-head .lede{color:var(--muted);max-width:68ch;margin:10px 0 0;font-size:1.02rem}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);margin:16px 0;overflow:hidden}
.card>.head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.card>.head h3{font-size:1.12rem;font-weight:700;flex:1}
.card>.head .hookline{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:.88rem;color:var(--muted);margin-top:3px}
.chev{width:22px;height:22px;flex:none;transition:transform .2s;color:var(--muted)}
.card.open>.head .chev{transform:rotate(90deg)}
.card>.body{display:none;padding:2px 18px 18px;border-top:1px solid var(--rule)}
.card.open>.body{display:block}
.part{margin-top:16px}
.part>.lab{font-size:.86rem;font-weight:600;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.part p{margin:0 0 8px}
.part ul{margin:4px 0 8px;padding-left:20px}
.part li{margin:2px 0}
.trap{background:var(--red-bg);border-left:3px solid var(--red);padding:10px 14px;border-radius:0 var(--r1) var(--r1) 0}
.trap .lab{color:var(--red)}
.addl{display:inline-block;font-size:.76rem;font-weight:600;color:var(--amber);background:var(--amber-bg);padding:2px 8px;border-radius:3px;margin-left:4px}
.prio{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.prio .dot{width:9px;height:9px;border-radius:50%}

.hook{margin-top:16px;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.06rem;line-height:1.5}
.hook mark,.hl{background:linear-gradient(104deg,transparent .4em,var(--hl) .5em,var(--hl) 97%,transparent 100%);color:var(--hl-ink);padding:.06em .35em;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:2px}

p code,li code,td code,.inline code,.hookline code,h3 code,.q code{background:var(--sheet2);border:1px solid var(--rule);padding:0 .3em;border-radius:3px;font-size:.88em}
.hook mark code{background:transparent;border:0}
.codewrap{position:relative;margin:8px 0}
pre.code{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:var(--r1);overflow-x:auto;font-size:.86rem;line-height:1.55;margin:0;tab-size:2}
pre.code .k{color:var(--k)}pre.code .s{color:var(--s)}pre.code .c{color:var(--c);font-style:italic}pre.code .n{color:var(--n)}
.copy{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.08);color:#C9D4DE;border:1px solid rgba(255,255,255,.15);border-radius:3px;font-size:.72rem;padding:2px 8px}

.reveal-box{margin-top:12px}
.reveal-btn{border:1px dashed var(--blue);background:var(--blue-bg);color:var(--blue);padding:9px 14px;border-radius:var(--r1);font-weight:600;font-size:.92rem;width:100%;text-align:left}
.reveal-btn:hover{border-style:solid}
.answer{display:none;margin-top:10px;background:var(--green-bg);border-left:3px solid var(--green);padding:10px 14px;border-radius:0 var(--r1) var(--r1) 0}
.answer.show{display:block;animation:pop .25s ease}
.answer .lab{color:var(--green)}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.q{font-weight:600;margin:0 0 6px}
.predict-in{width:100%;border:1px solid var(--rule);background:var(--sheet2);color:var(--ink);border-radius:var(--r1);padding:8px 10px;font:inherit;font-size:.92rem;margin:6px 0 4px}
.grade{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.grade .btn.on-y{background:var(--green);color:#fff;border-color:var(--green)}
.grade .btn.on-n{background:var(--red);color:#fff;border-color:var(--red)}

.recall{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--r2);padding:16px 18px;margin:22px 0}
.recall h3{font-size:1.1rem;margin-bottom:6px}
.recall .item{border-top:1px solid var(--rule);padding:10px 0}
.recall .item:first-of-type{border-top:0}

.tbl{overflow-x:auto;margin:16px 0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2)}
.tbl h3{font-size:1.02rem;padding:12px 16px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.82rem}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}

.note{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:14px 18px;margin:16px 0}
.note h3{font-size:1.05rem;margin-bottom:6px}
.note p{margin:0 0 8px}.note ul{margin:4px 0;padding-left:20px}

.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.done-row{display:flex;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}

/* Mental map */
.map{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:22px 18px;margin:18px 0}
.map-root{display:block;margin:0 auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.5rem;background:var(--hl);color:var(--hl-ink);border:0;padding:6px 22px;border-radius:4px}
.map-stem{width:2px;height:18px;background:var(--ink);margin:0 auto}
.map-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:2px solid var(--ink);padding-top:18px;position:relative}
.map-col{text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-radius:var(--r1);padding:12px;background:var(--sheet2);display:block;position:relative}
.map-col::before{content:"";position:absolute;top:-19px;left:50%;width:2px;height:18px;background:var(--ink)}
.map-col:hover{border-color:var(--blue)}
.map-col b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;margin-bottom:4px}
.map-col span{display:block;font-size:.84rem;color:var(--muted);line-height:1.45}
.map-foot{margin-top:18px;text-align:center}
.map-foot a{display:inline-block;text-decoration:none;color:var(--ink);border:2px solid var(--ink);border-radius:var(--r1);padding:10px 16px;background:var(--sheet)}
.map-foot a b{font-family:"Bricolage Grotesque",sans-serif}
.map-foot a span{display:block;font-size:.84rem;color:var(--muted)}
.map-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}

/* Event loop */
.el{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:16px;margin:18px 0}
.el-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.el-top select{font:inherit;padding:6px 8px;border:1px solid var(--rule);border-radius:var(--r1);background:var(--sheet2);color:var(--ink)}
.el-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.el-code pre{font-size:.8rem}
.el-code .line-on{background:rgba(246,220,69,.22);display:inline-block;width:100%}
.el-boxes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.el-box{border:1px solid var(--rule);border-radius:var(--r1);padding:8px;min-height:74px;background:var(--sheet2)}
.el-box h4{font-family:"IBM Plex Sans",sans-serif;font-size:.76rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.el-box.console{grid-column:1/-1;background:var(--code-bg);color:var(--code-ink);border-color:var(--code-bg)}
.el-box.console h4{color:#9AAAB8}
.chip{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:.76rem;padding:2px 7px;margin:2px;border-radius:3px;background:var(--sheet);border:1px solid var(--rule)}
.chip.micro{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.chip.macro{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.chip.stack{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.chip.out{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.el-note{margin-top:10px;font-size:.92rem;background:var(--blue-bg);padding:10px 12px;border-radius:var(--r1)}
.flow{font-family:"JetBrains Mono",monospace;font-size:.82rem;white-space:pre;overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:14px 16px;line-height:1.5;margin:16px 0}

/* Bubbling demo */
.bub{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:16px;margin:18px 0}
.bub-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.bx{border:2px solid var(--ink);border-radius:var(--r1);padding:16px 12px 12px;position:relative;font-size:.8rem;transition:background .2s}
.bx>.nm{position:absolute;top:2px;left:8px;font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--muted)}
.bx.flash{background:var(--hl)}
#bubInner{cursor:pointer;text-align:center;padding:22px 8px}
.bub-log{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r1);padding:10px 12px;font-family:"JetBrains Mono",monospace;font-size:.8rem;min-height:150px}
.bub-opts{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:.88rem}

/* Debounce demo */
.dt{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:16px;margin:18px 0}
.dt input{width:100%;padding:10px;border:1px solid var(--rule);border-radius:var(--r1);font:inherit;background:var(--sheet2);color:var(--ink)}
.dt-rows{display:grid;gap:8px;margin-top:12px}
.dt-row{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:.85rem}
.dt-track{height:22px;background:var(--sheet2);border:1px solid var(--rule);border-radius:3px;position:relative;overflow:hidden}
.dt-track i{position:absolute;top:3px;width:3px;height:14px;border-radius:1px}
.dt-row:nth-child(1) i{background:var(--muted)}.dt-row:nth-child(2) i{background:var(--green)}.dt-row:nth-child(3) i{background:var(--blue)}

/* Test */
.scorebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:12px 16px;margin:12px 0 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.scorebar b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem}
.tq{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:14px 18px;margin:12px 0}
.tq .meta{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.tq.hide{display:none}

.rev{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:14px 18px;margin:12px 0}
.rev h3{font-size:1.05rem;margin-bottom:6px}
.rev ul{margin:0;padding-left:20px}.rev li{margin:3px 0}
.hooks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:14px 0}
.hooks div{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r1);padding:10px 12px;font-weight:500;font-size:.92rem}
.prio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:14px 0}
.prio-grid .pg{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);padding:12px 14px}
.prio-grid h3{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prio-grid ul{margin:0;padding-left:18px;font-size:.88rem}

.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));background:var(--sheet);border-bottom:1px solid var(--rule)}
  .topbar h1{font-size:1.02rem;flex:1}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);height:auto;z-index:40;transform:translateX(-105%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .main{padding-top:22px}
  .el-grid,.bub-area{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;border-top:0;padding-top:0}
  .map-col::before{display:none}
  .scorebar{top:calc(env(safe-area-inset-top,0px) + 52px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><button class="btn small" id="menuBtn" aria-label="Open course menu">☰ Menu</button><h1>JS UI Interview Masterclass</h1></header>
<div class="app">
  <aside class="side" id="side" aria-label="Course navigation">
    <div class="brand"><h1>JS UI Interview Masterclass</h1><p>javascript.info, compressed for frontend interviews</p></div>
    <div class="overall"><span id="ovTxt">0% of the course</span><div class="bar" style="margin-top:6px"><i id="ovBar"></i></div></div>
    <ul class="nav" id="nav"></ul>
    <div class="side-tools"><button class="btn small" id="themeBtn">Toggle dark mode</button><button class="btn small ghost" id="resetBtn">Reset progress</button></div>
  </aside>
  <main class="main"><div class="wrap" id="content"></div></main>
</div>
<script>
window.COURSE = [];
window.COURSE.push({
  id:"start", icon:"🗺️", title:"Start here", pri:"blue", group:"Orientation",
  lede:"This course compresses javascript.info into what UI interviews actually test. Follow the flow: **understand, visualize, predict, reveal, explain, practice, recall, revise.** Your progress saves in this browser.",
  blocks:[
    {t:"map"},
    {t:"note", title:"How to use this in one day", text:
"- **Hours 1–2:** Fundamentals, Functions & objects, Array methods. These are the base for every trap question.\n- **Hours 3–4:** Async. Step through the event loop visualizer until you can predict every output.\n- **Hours 5–6:** DOM & browser, then Senior frontend.\n- **Hour 7:** Traps, Explain to an interviewer, and two or three coding problems.\n- **Hour 8:** Final test, then the 30-minute revision.\n- Every hidden answer is a recall rep. **Say your answer out loud before you click.** Mark yourself honestly with Got it / Missed it."},
    {t:"prio", groups:[
      {p:"red", title:"Must know for UI interviews", items:["Variables, scope, hoisting, TDZ","Types, coercion, `==` vs `===`","Closures","`this`, `call` / `apply` / `bind`","Prototypes and classes","Array methods","Copying objects (references, shallow vs deep)","Event loop, microtasks vs macrotasks","Promises, `async`/`await`, promise combinators","DOM events: bubbling, capturing, delegation","Fetch, AbortController, CORS basics","Debounce, throttle"]},
      {p:"orange", title:"Important", items:["Destructuring, spread, rest","Map, Set, WeakMap, WeakSet","Getters and setters","Error handling, custom errors","`async` vs `defer`, `DOMContentLoaded`","LocalStorage, SessionStorage, cookies","Garbage collection and memory leaks","MutationObserver, IntersectionObserver","ES modules: `import` / `export`","Optional chaining `?.`, nullish `??`"]},
      {p:"yellow", title:"Good to know", items:["Currying, decorators","Symbols, `Object.freeze`","WebSocket basics","Web Workers","Form events and validation","`structuredClone`","JSON methods","Number quirks: `0.1 + 0.2`, `NaN`"]},
      {p:"white", title:"Skip for today", items:["Generators and async iterators","Proxy and Reflect","Regular expressions in depth","Typed arrays, ArrayBuffer, Blob internals","Selection and Range, Shadow DOM, Web Components","`eval`, `with`, BigInt, Intl","Mouse drag-and-drop internals, IndexedDB"]}
    ]},

    {t:"concept", pri:"red", title:"Hoisting and the Temporal Dead Zone",

    {t:"concept", pri:"orange", title:"Rest, spread and destructuring",

    {t:"concept", pri:"red", title:"`this`",

    {t:"concept", pri:"orange", title:"Getters and setters",

     code:`const user = {

  set full(v) { [this.first, this.last] = v.split(" "); }
};
user.full;              // "Vikas Kumar"
user.full = "Anu Rao";  // runs the setter
user.first;             // "Anu"`,

     trap:"A setter that assigns to the same property name (`set name(v){ this.name = v }`) recurses forever. Store it in a different field like `this._name`.",

    {t:"concept", pri:"red", title:"Shallow copy vs deep copy",
     simple:"A **shallow** copy duplicates the top level only; nested objects are still shared. A **deep** copy duplicates every level.\n- Shallow: `{...obj}`, `Object.assign({}, obj)`, `[...arr]`, `arr.slice()`\n- Deep: `structuredClone(obj)` (modern browsers), `JSON.parse(JSON.stringify(obj))` (lossy), or a recursive function.",

     code:`const orig = { user: { name: "A" }, tags: ["x"], when: new Date() };

const shallow = { ...orig };
shallow.user.name = "B";
orig.user.name;          // "B"  (shared nested object)

const deep = structuredClone(orig);
deep.user.name = "C";

JSON.parse(JSON.stringify({ d: new Date(), f() {}, u: undefined }));
// { d: "2026-...Z" }  Date → string, function and undefined dropped`,

    {t:"concept", pri:"red", open:true, title:"`map`, `filter`, `reduce`",
     simple:"`map` transforms, `filter` selects, `reduce` accumulates. Chain them to go from API data to UI data.",
     model:"A factory line: `filter` is quality control, `map` is the paint shop, `reduce` packs everything into one box.",
     code:`const orders = [
  { id: 1, status: "paid", total: 40 },
  { id: 2, status: "pending", total: 25 },
  { id: 3, status: "paid", total: 35 }
];
const paidTotal = orders
  .filter(o => o.status === "paid")
  .map(o => o.total)
  .reduce((sum, t) => sum + t, 0);   // 75

const byStatus = orders.reduce((acc, o) => {
  (acc[o.status] ||= []).push(o);
  return acc;
}, {});  // { paid: [..], pending: [..] }`,
     happens:"`reduce(callback, initial)` calls `callback(accumulator, item, index, array)` for each item. Without an initial value, the first item becomes the accumulator and iteration starts at index 1. On an empty array without an initial value, it throws.",
     q:"Implement grouping of items by a key.",
     a:"Use `reduce` with an object accumulator: for each item, compute the key, create the array if missing, push the item, and return the accumulator. Newer runtimes also offer `Object.groupBy(items, fn)`.",
     trap:"Forgetting to `return acc` inside `reduce`, or omitting the initial value so an empty array throws `TypeError: Reduce of empty array with no initial value`.",

    {t:"concept", pri:"red", title:"`find`, `some`, `every`, `forEach`",
     simple:"`find` returns the first matching **item**. `some`/`every` return booleans and stop early. `forEach` is for side effects, returns `undefined`, and **can't be stopped** with `break` or `return`.",
     model:"`find` is a search party that goes home at the first hit. `forEach` is a postman who must visit every house.",
     code:`const users = [{ id: 1, admin: false }, { id: 2, admin: true }];
users.find(u => u.id === 2);     // { id: 2, admin: true }
users.some(u => u.admin);        // true
users.every(u => u.id > 0);      // true

[1, 2, 3].forEach(n => { if (n === 2) return; console.log(n); });
// 1, 3  (return only skips this callback)

[].every(x => x > 100);          // true  (vacuous truth)
[].some(x => x > 100);           // false`,
     happens:"`return` inside `forEach` exits the current callback only. To stop early, use `for...of` with `break`, or `some`/`find`.",
     q:"How do you break out of a `forEach`?",

    {t:"concept", pri:"red", title:"`sort` traps",
     simple:"Default `sort()` converts items to **strings** and compares them lexicographically. Always pass a comparator for numbers. `sort` **mutates** the original array and returns the same reference.",
     model:"Default sort is a librarian alphabetizing numbers as words: \"10\" comes before \"9\" because \"1\" < \"9\".",
     code:`[10, 1, 9, 2].sort();               // [1, 10, 2, 9]
[10, 1, 9, 2].sort((a, b) => a - b); // [1, 2, 9, 10]
users.sort((a, b) => a.name.localeCompare(b.name));

const original = [3, 1, 2];
const sorted = original.sort((a, b) => a - b);
sorted === original;                 // true (mutated!)
const safe = [...original].sort((a, b) => a - b); // or toSorted()`,
     happens:"The comparator returns negative (a first), positive (b first) or zero. Modern engines guarantee a **stable** sort.",
     q:"Why does `[10, 1, 9].sort()` give `[1, 10, 9]`?",
     a:"Without a comparator, `sort` converts elements to strings and compares UTF-16 code units, so \"10\" sorts before \"9\". For numbers pass `(a, b) => a - b`. Also note `sort` mutates the array in place; copy first or use `toSorted` if you need the original, such as with React state.",
     trap:"Sorting React state or props directly. It mutates, so the UI may not re-render and other code sees changed data.",
     hook:"sort mutates and sorts as strings. Copy first, compare with a - b."},
    {t:"predict", title:"The parseInt trap", code:`console.log(["1", "2", "3"].map(parseInt));`, answer:"[1, NaN, NaN]",
     explain:"`map` passes `(value, index, array)`. So the calls are `parseInt(\"1\", 0)` → 1 (radix 0 means default), `parseInt(\"2\", 1)` → NaN (radix 1 is invalid), `parseInt(\"3\", 2)` → NaN (3 isn't a binary digit). Fix: `.map(Number)` or `.map(s => parseInt(s, 10))`.",
     rule:"map passes value, index, array. Wrap functions that take a second argument."},
    {t:"note", title:"Mutating vs non-mutating, at a glance", text:"- **Mutate:** `push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`, `fill`, `copyWithin`, setting `length`.\n- **Return new:** `map`, `filter`, `slice`, `concat`, spread, `flat`, `flatMap`, `toSorted`, `toReversed`, `toSpliced`, `with`.\n- `slice(start, end)` copies; `splice(start, deleteCount, ...items)` edits in place. **sPlice changes the Place.**"},
    {t:"recall", items:[
      ["What does `find` return when nothing matches? And `findIndex`?","`undefined` and `-1`."],
      ["What does `[].every(fn)` return?","`true`. With no items, nothing fails the test."],
      ["How do you sort numbers descending without changing the original?","`[...arr].sort((a, b) => b - a)` or `arr.toSorted((a, b) => b - a)`."],
      ["Why use `includes` over `indexOf` for `NaN`?","`includes` uses SameValueZero, so `[NaN].includes(NaN)` is `true`, while `indexOf(NaN)` is `-1`."],

 {name:"1. setTimeout vs Promise", code:`console.log("A");

  {line:3, stack:["script"], macro:["cb B"], out:["A"], note:"The 0ms timer finishes. Its callback goes to the **macrotask queue**. It can't run until the stack is empty."},
  {line:7, stack:["script"], micro:["then → C"], macro:["cb B"], out:["A"], note:"The promise is already resolved, so its `.then` callback goes straight into the **microtask queue**."},
  {line:11, stack:["script","console.log(\"D\")"], micro:["then → C"], macro:["cb B"], out:["A","D"], note:"Still synchronous. `D` prints."},

 ]},
 {name:"2. Timers scheduled inside promises", code:`console.log(1);

Promise.resolve().then(() => {

  {line:2, stack:["script"], macro:["log 2"], out:["1"], note:"Timer callback queued as a macrotask (after the timer elapses)."},
  {line:3, stack:["script"], micro:["then A (3, timer 4)"], macro:["log 2"], out:["1"], note:"First `.then` queued as a microtask."},
  {line:7, stack:["script"], micro:["then A (3, timer 4)","then B (5)"], macro:["log 2"], out:["1"], note:"Second `.then` queued behind it. Microtasks run in FIFO order."},

 ]},
 {name:"3. async / await", code:`async function f() {

window.COURSE.push({
  id:"async", icon:"⏳", title:"Async JavaScript", pri:"red", group:"Async",
  lede:"The biggest source of output questions. Learn one model, the event loop, and every ordering question becomes mechanical.",
  blocks:[
    {t:"flow", label:"Event loop diagram", text:`
   Your JS code
        │
        ▼
 ┌──────────────┐    hands off async work    ┌────────────────────────┐
 │  CALL STACK  │ ─────────────────────────▶ │  WEB APIs (browser)    │
 │  runs 1 thing│                            │  timers, fetch, events │
 └──────▲───────┘                            └───────────┬────────────┘
        │                                                │ when done
        │                          ┌─────────────────────┴───────────────┐
        │                          ▼                                     ▼
        │                ┌───────────────────┐               ┌──────────────────────┐
        │                │  MICROTASK QUEUE  │               │  MACROTASK QUEUE     │
        │                │  promise .then,   │               │  setTimeout, events, │
        │                │  await, queueMicro│               │  setInterval, I/O    │
        │                └─────────┬─────────┘               └──────────┬───────────┘
        │                          │ 1st: drain ALL                     │ 2nd: take ONE
        │                          ▼                                    ▼
        └────────────────────── EVENT LOOP: stack empty? ◀──────────────┘
                                 (browser may render between macrotasks)`},
    {t:"concept", pri:"red", open:true, title:"Call stack, Web APIs and the event loop",
     simple:"JavaScript runs on **one thread** with one call stack. Slow things (timers, network, events) are handled by the browser's Web APIs. When they finish, their callbacks are queued. The **event loop** runs this algorithm forever:\n- Run the current macrotask (the script itself is the first one) until the stack is empty.\n- Run **every** microtask in the queue, including ones added while draining.\n- Render if needed.\n- Take the next macrotask and repeat.",
     model:"A single chef (call stack). Waiters (Web APIs) handle the slow stuff. VIP orders (microtasks) are always cooked before the next regular order (macrotask), and the chef finishes all VIP orders first.",
     code:`console.log("A");
setTimeout(() => console.log("B"), 0);
Promise.resolve().then(() => console.log("C"));
console.log("D");
// A D C B`,
     happens:"`setTimeout(fn, 0)` means \"at least 0ms\", then wait for the stack and all microtasks. Promise callbacks are microtasks, so they always beat a timer that was queued in the same turn.",
     q:"JavaScript is single-threaded. How does it handle async operations?",
     a:"The JS engine runs one call stack, but the browser provides Web APIs that do work in the background: timers, network, DOM events. When that work completes, callbacks are queued. The event loop waits until the call stack is empty, runs all queued microtasks (promise callbacks), possibly renders, then takes the next macrotask (timer or event callback). That's why long synchronous code blocks everything, including rendering.",
     trap:"Thinking `setTimeout(fn, 0)` runs immediately, or that it runs before already-queued promise callbacks.",
     hook:"Sync first. Then ALL microtasks. Then ONE macrotask. Repeat."},
    {t:"eventloop"},
    {t:"concept", pri:"red", title:"Microtasks vs macrotasks",
     simple:"**Microtasks:** `.then`/`.catch`/`.finally` callbacks, code after `await`, `queueMicrotask`, MutationObserver callbacks. **Macrotasks (tasks):** the script, `setTimeout`, `setInterval`, UI events, network callbacks, `MessageChannel`.",
     model:"Microtasks are the express lane that must be completely empty before the regular lane moves one step.",
     code:`setTimeout(() => console.log("timeout"));
queueMicrotask(() => console.log("micro 1"));
Promise.resolve().then(() => {
  console.log("micro 2");
  queueMicrotask(() => console.log("micro 3")); // added while draining
});
// micro 1, micro 2, micro 3, timeout`,
     happens:"Because the loop drains microtasks completely, a microtask that keeps scheduling microtasks can **starve** rendering and timers, freezing the page.",
     q:"What's the difference between microtasks and macrotasks?",
     a:"Both are queues of callbacks. After each macrotask, the event loop drains the whole microtask queue before rendering or running the next macrotask. Promises and `await` use microtasks, so they run sooner than `setTimeout` callbacks. An infinite chain of microtasks can block rendering entirely.",
     trap:"Using recursive `Promise.resolve().then(loop)` for a polling loop. It never yields to rendering. Use `setTimeout` or `requestAnimationFrame`.",
     hook:"Microtask → Promise callbacks. Macrotask → setTimeout callbacks."},
    {t:"concept", pri:"red", title:"Promises: states and chaining",
     simple:"A promise represents a future value. States: **pending** → **fulfilled** (with a value) or **rejected** (with a reason). Once settled, it never changes. The executor function runs **synchronously**. Each `.then` returns a **new promise**, resolved with whatever the handler returns, or rejected if it throws.",
     model:"A restaurant buzzer. Pending while you wait, then it lights up green (fulfilled) or red (rejected), and it can only light up once.",
     code:`const p = new Promise((resolve, reject) => {
  console.log("executor runs now");   // sync!
  setTimeout(() => resolve(10), 100);
});

p.then(v => v * 2)                     // 20
 .then(v => { throw new Error("boom"); })
 .then(v => console.log("skipped"))
 .catch(e => { console.log(e.message); return 0; }) // "boom"
 .then(v => console.log("recovered with", v))       // 0
 .finally(() => console.log("cleanup"));             // value passes through`,
     happens:"A thrown error skips every `.then` until the nearest `.catch`. `.catch` returning a value turns the chain back into fulfilled. `.finally` gets no argument and passes the previous result or error through unchanged.",
     q:"What does `.then` return?",
     a:"A new promise. It resolves with the handler's return value; if the handler returns a promise, the chain waits for it; if the handler throws, the new promise rejects. That's what makes flat chaining possible instead of nested callbacks.",
     trap:"Forgetting to `return` inside a `.then`. The next `.then` receives `undefined` and doesn't wait for your inner promise.",
     hook:"Executor is sync. then returns a new promise. Return or you lose the chain."},
    {t:"concept", pri:"red", title:"`async` / `await` and error handling",

     model:"`await` is a bookmark: the function puts a bookmark in, steps aside so others can work, and continues from the bookmark later.",
     code:`async function loadUser(id) {

     happens:"`await x` is roughly `Promise.resolve(x).then(continueFunction)`. The rest of the function becomes a microtask. Errors thrown in an async function reject its returned promise.",

    {t:"table", title:"Promise combinators", head:["Method","Resolves when","Rejects when","Use for"], rows:[

  .finally(() => console.log("done"));`, answer:"25\ndone",

    {t:"predict", title:"Promise.all fail-fast", code:`const ok = v => new Promise(r => setTimeout(() => r(v), 100));
const fail = () => Promise.reject(new Error("x"));

Promise.all([ok(1), fail(), ok(3)])
  .then(v => console.log("then", v))
  .catch(e => console.log("catch", e.message));

Promise.allSettled([ok(1), fail()])
  .then(r => console.log(r.map(x => x.status)));`, answer:"catch x\n[\"fulfilled\", \"rejected\"]",

    {t:"recall", items:[

    {t:"concept", pri:"orange", title:"Page load: `DOMContentLoaded`, `load`, `async`, `defer`",

    {t:"concept", pri:"red", title:"CORS",

window.COURSE.push({
  id:"senior", icon:"🚀", title:"Senior frontend JavaScript", pri:"red", group:"Frontend engineering",
  lede:"Real UI problems interviewers use to separate mid-level from senior. Each one: **problem, why it happens, solution, code, interview question.**",
  blocks:[
    {t:"debounce"},
    {t:"senior", title:"Debouncing", hook:"Debounce = wait until they stop.",
     problem:"A search box fires an API call on every keystroke. Typing \"javascript\" sends 10 requests.",
     why:"`input` fires per character. Without control, you waste requests, overload the server and risk out-of-order results.",
     solution:"Delay the call; restart the timer on every new event. The function runs only after the user pauses for `ms`. The timer lives in a closure.",
     code:`function debounce(fn, ms) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  };
}
const onSearch = debounce(q => fetchResults(q), 300);
input.addEventListener("input", e => onSearch(e.target.value));`,
     q:"Implement debounce and explain where you'd use it.",
     a:"Debounce returns a wrapper that clears any pending timer and starts a new one on each call, so the original runs once, `ms` after the last call. It preserves `this` and arguments with `apply`. Use it for search-as-you-type, resize-end handling, autosave and form validation. Variants add a `leading` option and a `cancel` method."},
    {t:"senior", title:"Throttling", hook:"Throttle = at most once per interval.",
     problem:"A scroll or mousemove handler runs hundreds of times per second and the page stutters.",
     why:"Scroll, resize, pointermove fire at frame rate or faster. Heavy work in each handler blocks the main thread.",
     solution:"Allow the function to run at most once per interval and drop or defer the calls in between. For visual updates, `requestAnimationFrame` gives once-per-frame throttling.",
     code:`function throttle(fn, ms) {
  let last = 0, timer = null;
  return function (...args) {
    const now = Date.now(), remaining = ms - (now - last);
    if (remaining <= 0) {
      clearTimeout(timer); timer = null;
      last = now; fn.apply(this, args);
    } else if (!timer) {            // trailing call so the final state isn't lost
      timer = setTimeout(() => { last = Date.now(); timer = null; fn.apply(this, args); }, remaining);
    }
  };
}
window.addEventListener("scroll", throttle(updateProgressBar, 100));`,
     q:"Debounce vs throttle: when do you use each?",
     a:"Debounce waits for a pause and runs once at the end: search input, autosave, resize end. Throttle runs regularly at a fixed maximum rate during continuous activity: scroll position, drag, mousemove, infinite scroll checks. Both are higher-order functions using closures to hold timer state."},
    {t:"table", title:"Debounce vs throttle", head:["","Debounce","Throttle"], rows:[
      ["Fires","Once, after events stop","Regularly, at most every `ms`"],
      ["Analogy","Elevator door waits until people stop entering","A metronome"],
      ["Use for","Search, autosave, validation, resize end","Scroll, drag, mousemove, analytics pings"]
    ]},
    {t:"senior", title:"Memoization", hook:"Memoize = same input, cached output.",
     problem:"An expensive pure function (formatting, filtering a big list, a recursive calculation) runs repeatedly with the same inputs.",
     why:"Recomputing identical results wastes CPU and slows renders.",
     solution:"Cache results keyed by the arguments in a closure. Only for **pure** functions. Bound the cache size if inputs are unbounded.",
     code:`function memoize(fn, keyFn = (...a) => JSON.stringify(a)) {
  const cache = new Map();
  return function (...args) {
    const key = keyFn(...args);
    if (cache.has(key)) return cache.get(key);
    const result = fn.apply(this, args);
    cache.set(key, result);
    return result;
  };
}
const fib = memoize(n => (n < 2 ? n : fib(n - 1) + fib(n - 2)));
fib(50); // instant`,
     q:"What are the risks of memoization?",
     a:"Memory growth if the cache is unbounded (use LRU or a WeakMap for object keys), wrong results for impure functions or ones depending on external state, and key collisions or cost when serializing complex arguments. It only pays off when computation costs more than key creation and lookup."},
    {t:"senior", title:"Race conditions and stale API responses", hook:"Last request wins: cancel or ignore the old ones.",
     problem:"User types \"re\" then \"react\". The \"re\" response arrives **after** \"react\" and overwrites the correct results.",
     why:"Network latency isn't ordered. Responses can come back in a different order than requests were sent.",
     solution:"Cancel the previous request with AbortController, or tag each request and ignore responses that aren't the latest.",
     code:`let controller;
async function search(q) {
  controller?.abort();                 // cancel the previous request
  controller = new AbortController();
  try {
    const res = await fetch("/api?q=" + encodeURIComponent(q), { signal: controller.signal });
    render(await res.json());
  } catch (e) { if (e.name !== "AbortError") showError(e); }
}

// Alternative: ignore stale responses
let latest = 0;
async function search2(q) {
  const id = ++latest;
  const data = await (await fetch("/api?q=" + q)).json();
  if (id === latest) render(data);     // drop out-of-date results
}`,
     q:"How do you prevent stale data in autocomplete?",
     a:"Debounce input to cut requests, then make sure only the latest response is applied: abort the previous fetch with AbortController (also saves bandwidth), or keep a request counter and ignore responses that don't match the latest ID. In React, also abort in the effect cleanup so unmounted components don't set state."},
    {t:"senior", title:"Search / autocomplete (full design)", hook:"Debounce + abort + cache + keyboard + a11y.",
     problem:"Build a production autocomplete.",
     why:"Interviewers use it because it combines events, async, performance and accessibility in one feature.",
     solution:"- Debounce input (~300ms), skip empty or very short queries.\n- Abort the previous request; ignore stale responses.\n- Cache results by query in a `Map`.\n- Keyboard: arrow keys move highlight, Enter selects, Escape closes.\n- Accessibility: `role=\"combobox\"`, `aria-expanded`, `aria-activedescendant`, `role=\"listbox\"`/`option`.\n- Highlight matches safely (no raw `innerHTML` with user input).\n- Handle loading, empty and error states. Close on outside click via a document listener.",
     code:`const cache = new Map();
let controller;
const run = debounce(async (q) => {
  if (q.length < 2) return renderList([]);
  if (cache.has(q)) return renderList(cache.get(q));
  controller?.abort(); controller = new AbortController();
  setLoading(true);
  try {
    const res = await fetch("/api/suggest?q=" + encodeURIComponent(q), { signal: controller.signal });
    const items = await res.json();
    cache.set(q, items); renderList(items);
  } catch (e) { if (e.name !== "AbortError") renderError(); }
  finally { setLoading(false); }
}, 300);
input.addEventListener("input", e => run(e.target.value.trim()));`,
     q:"Walk me through building an autocomplete component.",
     a:"I'd debounce the input, abort or ignore stale requests so results never arrive out of order, cache by query, and render a listbox with full keyboard support and ARIA combobox semantics. I'd handle loading, empty and error states, close on blur or outside click, and render matches with `textContent` to avoid XSS. For huge result sets I'd limit or virtualize the list."},
    {t:"senior", title:"API cancellation and optimistic UI", hook:"Optimistic = update now, roll back on failure.",
     problem:"Liking a post waits 800ms for the server before the heart turns red. It feels slow.",
     why:"Waiting for a round-trip before showing feedback makes the UI feel laggy.",
     solution:"Update the UI immediately, send the request, and roll back with an error message if it fails. Keep the previous state so you can restore it.",
     code:`async function toggleLike(post) {
  const prev = post.liked;
  post.liked = !prev; render(post);              // optimistic
  try {
    const res = await fetch("/api/posts/" + post.id + "/like", { method: prev ? "DELETE" : "POST" });
    if (!res.ok) throw new Error();
  } catch {
    post.liked = prev; render(post);             // roll back
    toast("Couldn't update like. Try again.");
  }
}`,
     q:"When would you not use optimistic UI?",
     a:"When failure is likely or costly and the user must know the real outcome: payments, irreversible deletes, bookings, anything where showing false success would mislead. Also when the server computes the result, such as a generated ID or price, unless you can reconcile it after."},
    {t:"senior", title:"Memory leaks, garbage collection and listener cleanup", hook:"Every add needs a remove: listeners, timers, observers, subscriptions.",
     problem:"The SPA gets slower the longer it's open; memory in DevTools keeps climbing.",
     why:"JS uses **reachability**-based garbage collection (mark-and-sweep): anything reachable from roots (globals, the stack, active closures) is kept. Leaks happen when something still references objects you no longer need:\n- Event listeners on `window`/`document` never removed\n- `setInterval` never cleared\n- Detached DOM nodes still referenced in JS arrays or Maps\n- Closures capturing large data\n- Growing caches or global arrays\n- Observers and WebSocket subscriptions not disconnected",
     solution:"Pair every setup with a teardown. Use `AbortController` to remove many listeners at once, `WeakMap` for per-object metadata, and bounded caches. Find leaks with DevTools heap snapshots (search \"Detached\").",
     code:`function mountWidget(el) {
  const ac = new AbortController();

  document.addEventListener("keydown", onKey, { signal: ac.signal });

}`,
     q:"What causes memory leaks in frontend apps and how do you find them?",
     a:"Objects stay reachable when they shouldn't: listeners on global objects that aren't removed, uncleared intervals, references to removed DOM nodes, unbounded caches, closures holding large data, and undisconnected observers or sockets. I prevent them with cleanup functions on unmount, AbortController signals for listeners, and WeakMap for metadata. To find them I take heap snapshots in Chrome DevTools before and after repeating an action and compare retained objects, especially detached DOM trees."},
    {t:"senior", title:"Rendering performance and large DOM", hook:"Read all, then write all. Animate transform and opacity.", addl:true,
     problem:"A list of 10,000 rows is slow to render and scroll; animations jank.",
     why:"The browser pipeline is **JS → Style → Layout → Paint → Composite**. Changing geometry forces layout. Reading layout values (`offsetHeight`, `getBoundingClientRect`) right after writing styles forces a **synchronous layout** (layout thrashing). Huge DOM trees make every layout and style recalculation slower.",
     solution:"- Batch reads, then writes. Never alternate in a loop.\n- Animate `transform`/`opacity` (compositor only), not `top`/`width`.\n- Use `requestAnimationFrame` for visual updates.\n- Virtualize long lists: render only visible rows plus a buffer.\n- Use DocumentFragment or one `append` for bulk inserts.\n- Use `content-visibility: auto` for offscreen sections.\n- Break long tasks into chunks so input stays responsive.",
     code:`// Bad: forces layout on every iteration
items.forEach(el => { el.style.width = el.parentElement.offsetWidth / 2 + "px"; });

// Good: read everything, then write everything
const widths = items.map(el => el.parentElement.offsetWidth);
requestAnimationFrame(() => items.forEach((el, i) => { el.style.width = widths[i] / 2 + "px"; }));`,
     q:"How do you make a list of 100,000 items performant?",
     a:"Don't render them all. Virtualize: compute which rows fall within the viewport from scroll position and row height, render only those plus a buffer, and use a spacer for total height. Combine with pagination or infinite loading from the server, memoized row rendering, stable keys, and throttled or rAF-driven scroll handling."},
    {t:"senior", title:"Infinite scrolling and pagination", hook:"Sentinel + IntersectionObserver + loading guard.", addl:true,
     problem:"Load more items as the user scrolls without duplicate requests or missing pages.",
     why:"Scroll handlers fire constantly; without a guard you request the same page multiple times. Offset pagination can skip or repeat items when data changes.",
     solution:"Observe a sentinel element at the end of the list. Guard with an `isLoading` flag and a `hasMore` flag. Prefer **cursor-based** pagination for live feeds. Keep a \"Load more\" fallback and preserve scroll position on back navigation.",
     code:`let cursor = null, loading = false, hasMore = true;
const io = new IntersectionObserver(async ([entry]) => {
  if (!entry.isIntersecting || loading || !hasMore) return;
  loading = true;
  try {
    const res = await fetch("/api/feed?cursor=" + (cursor ?? ""));
    const { items, nextCursor } = await res.json();
    appendItems(items);
    cursor = nextCursor; hasMore = Boolean(nextCursor);
    if (!hasMore) io.disconnect();
  } finally { loading = false; }
}, { rootMargin: "400px" });
io.observe(document.querySelector("#sentinel"));`,
     q:"Offset vs cursor pagination?",
     a:"Offset (`?page=3&limit=20`) is simple and supports jumping to page N, but items shift when data is inserted or deleted, causing duplicates or gaps. Cursor pagination (`?after=lastId`) is stable for live feeds and efficient for the database, but can't jump to arbitrary pages. Infinite feeds usually use cursors; admin tables often use offsets."},
    {t:"senior", title:"Concurrent API requests and caching", hook:"Parallel with Promise.all, limit concurrency, dedupe in-flight.", addl:true,
     problem:"You need to fetch 200 resources. Firing all at once overwhelms the server; doing them one by one is slow. The same request is also triggered by several components.",
     why:"Unbounded parallelism hits rate limits and browser connection limits. Duplicate requests waste bandwidth.",
     solution:"Run with a concurrency limit. Cache responses and dedupe **in-flight** requests by storing the promise, not just the result. Invalidate with a TTL or stale-while-revalidate.",
     code:`async function mapLimit(items, limit, fn) {
  const results = new Array(items.length); let i = 0;
  async function worker() {
    while (i < items.length) { const idx = i++; results[idx] = await fn(items[idx], idx); }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

const inflight = new Map();
function getJSON(url) {
  if (!inflight.has(url)) {
    inflight.set(url, fetch(url).then(r => r.json()).catch(e => { inflight.delete(url); throw e; }));
  }
  return inflight.get(url);   // every caller shares one request
}`,
     q:"How would you avoid duplicate API calls from multiple components?",
     a:"Cache the promise keyed by URL so concurrent callers share one in-flight request, and delete the entry on failure so retries work. Add a TTL or stale-while-revalidate for freshness. Libraries like React Query or SWR implement this pattern, plus background refetch and invalidation."},
    {t:"senior", title:"Error handling at the app level", hook:"Catch, show, report, recover.",
     problem:"An unhandled promise rejection or exception leaves the UI blank or frozen with no message.",
     why:"Errors in async code don't reach a surrounding `try/catch` unless awaited. Uncaught errors end up in the console only.",
     solution:"Handle errors where you can recover (show a retry), and add global handlers to report the rest. Use custom error classes to distinguish cases. Retry transient network failures with backoff.",
     code:`class HttpError extends Error {
  constructor(status) { super("HTTP " + status); this.name = "HttpError"; this.status = status; }
}
window.addEventListener("error", e => report(e.error));
window.addEventListener("unhandledrejection", e => report(e.reason));

async function retry(fn, tries = 3, delay = 500) {
  try { return await fn(); }
  catch (e) {
    if (tries <= 1) throw e;
    await new Promise(r => setTimeout(r, delay));
    return retry(fn, tries - 1, delay * 2);   // exponential backoff
  }
}`,
     q:"How do you handle errors in async code?",
     a:"With `try/catch` around awaited calls or `.catch` on chains, checking `res.ok` for HTTP errors. I show meaningful UI states with retry, use custom error classes to branch on error types, retry transient failures with exponential backoff, and register `unhandledrejection` and `error` listeners to report anything missed to monitoring."},
    {t:"senior", title:"Web Workers", hook:"Workers = heavy CPU off the main thread, no DOM.", addl:true, pri:"yellow",
     problem:"Parsing a 50 MB CSV or running a heavy calculation freezes the page.",
     why:"The main thread does JS, layout, paint and input. Long tasks block all of them.",
     solution:"Move CPU-heavy work to a Web Worker, which runs in its own thread and talks via `postMessage`. Workers can't touch the DOM. Data is copied (structured clone) unless transferred.",
     code:`// main.js
const worker = new Worker("parser.js");
worker.postMessage(fileText);
worker.onmessage = e => renderTable(e.data);

// parser.js
self.onmessage = e => {
  const rows = e.data.split("\n").map(l => l.split(","));
  self.postMessage(rows);
};`,
     q:"When would you use a Web Worker?",
     a:"For CPU-heavy work that would block the main thread for more than a frame or so: parsing large files, image processing, encryption, complex data transforms. Not for DOM work, which workers can't access, and not for network calls, which are already async."},
    {t:"senior", title:"WebSockets", hook:"WebSocket = one open, two-way connection.", pri:"yellow",
     problem:"Chat or live dashboards need server-pushed updates; polling every second is wasteful.",
     why:"HTTP is request-response. Polling adds latency and load.",
     solution:"Open a WebSocket for full-duplex messages. Handle reconnect with backoff, heartbeats, and close it on unmount. For one-way server push, Server-Sent Events (`EventSource`) are simpler.",
     code:`function connect() {
  const ws = new WebSocket("wss://example.com/live");
  ws.onopen = () => ws.send(JSON.stringify({ type: "subscribe", room: "42" }));
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 2000);   // naive reconnect
  return ws;
}`,
     q:"WebSocket vs polling vs SSE?",
     a:"Polling is simplest but wasteful and laggy. Server-Sent Events give one-way server-to-client streaming over HTTP with automatic reconnect. WebSockets give a persistent two-way channel, best for chat, collaboration and games, but you manage reconnects, heartbeats and scaling yourself."},
    {t:"senior", title:"Browser performance checklist", hook:"Measure first: Performance panel, Lighthouse, Web Vitals.", addl:true, pri:"orange",
     problem:"\"The app feels slow.\" Where do you start?",
     why:"Slowness comes from different places: network (big bundles, waterfalls), main thread (long tasks), rendering (layout thrash), or memory.",
     solution:"- **Measure:** DevTools Performance and Network panels, Lighthouse, Core Web Vitals (LCP loading, INP responsiveness, CLS layout stability).\n- **Load less:** code splitting and dynamic `import()`, tree shaking, compression, image formats and sizes, caching headers.\n- **Load smarter:** `defer` scripts, preload critical assets, lazy-load below the fold.\n- **Run less:** debounce/throttle, memoize, Web Workers, break up long tasks.\n- **Render less:** virtualization, avoid layout thrashing, animate `transform`.",
     q:"How do you approach a performance problem?",
     a:"Measure before changing anything: reproduce it, record a Performance trace and check Network and Web Vitals to see whether it's loading, scripting, rendering or memory. Then fix the biggest cost: split bundles and lazy-load for load time; break up long tasks, debounce or move work to a worker for responsiveness; virtualize and batch DOM changes for rendering. Then measure again to confirm."},
    {t:"recall", items:[
      ["Where does debounce keep its timer?","In a closure created when `debounce` is called."],
      ["Two ways to prevent stale autocomplete results?","Abort the previous request with AbortController, or tag requests with an incrementing ID and ignore responses that aren't the latest."],
      ["What is layout thrashing?","Alternating DOM writes and layout reads in a loop, forcing the browser to recalculate layout synchronously each time."],
      ["How does JS garbage collection decide what to free?","Reachability: objects not reachable from roots (globals, the current stack, live closures) are collected via mark-and-sweep."],
      ["Remove three listeners with one call?","Pass the same `AbortController` signal to each `addEventListener` and call `abort()`."]
    ]}
  ]

const E = (q, weak, good, strong) => ({t:"explain", q, weak, good, strong});

  id:"explain", icon:"🎙️", title:"Explain this to an interviewer", pri:"red", group:"Practice",
  lede:"Practice speaking. Read the weak answer, say your own version out loud in 30–60 seconds, then compare with the good and strong answers.",
  blocks:[
    E("Explain closure.", "A function inside another function.",
      "A closure is a function that remembers the variables from the scope where it was created, so it can still use them after the outer function returns. For example a counter factory returns a function that keeps incrementing its private `count`.",
      "Every function captures a reference to its outer Lexical Environment at creation. As long as the function is reachable, that environment stays alive, so closures give us private state, factories, memoization caches and debounce timers. They hold live references, not copies, which explains the classic `var`-in-a-loop bug, and they're a common source of leaks when a long-lived callback captures large objects."),
    E("Explain `this`.", "It refers to the current object.",
      "`this` is set by how a function is called: the object before the dot for methods, the new object with `new`, an explicit value with call, apply or bind, and `undefined` for plain calls in strict mode. Arrow functions don't have their own `this`; they use the surrounding one.",
      "Same rules, plus the precedence: `new` beats `bind`, which beats a method call, which beats a default call. I'd mention the practical bug: passing a method as a callback loses `this`, fixed with an arrow wrapper, `bind`, or class field arrows. In DOM listeners with a regular function, `this` is `currentTarget`."),
    E("Explain the event loop.", "It handles async code.",
      "JS has one call stack. Async work like timers and fetch is handled by the browser, and when it completes, callbacks are queued. When the stack is empty, the event loop first runs all microtasks, like promise callbacks, then takes the next macrotask, like a setTimeout callback.",
      "The loop algorithm: run one macrotask to completion, drain the microtask queue fully (including newly added ones), let the browser render if needed, repeat. This explains why promises beat timers, why `setTimeout(fn, 0)` isn't immediate, why long synchronous tasks freeze input and rendering, and why a recursive microtask chain can starve the page. For smooth visual work I'd use `requestAnimationFrame`, which runs before paint."),
    E("Explain promises.", "They're used for async stuff.",
      "A promise is an object representing a future value. It starts pending and settles once, to fulfilled with a value or rejected with a reason. You consume it with then, catch and finally, and each then returns a new promise, which lets you chain steps.",
      "Promises solve callback nesting and inversion of control: the executor runs synchronously, settlement is final, and handlers always run asynchronously as microtasks, even for already-resolved promises. Errors propagate down the chain to the nearest catch. Combinators handle coordination: `all` fails fast, `allSettled` reports everything, `race` for timeouts, `any` for first success."),
    E("Explain async/await.", "It makes code wait.",
      "`async/await` is syntax over promises. An async function always returns a promise; `await` pauses that function until a promise settles and gives back its value or throws its error, so you can use normal try/catch.",
      "Awaiting pauses only the current function, not the thread; the continuation is scheduled as a microtask. Code before the first await runs synchronously. The big performance trap is serial awaits on independent work; I'd start the promises first and `await Promise.all`. Also `forEach` ignores async callbacks, so I'd use `for...of` or `Promise.all(map)`."),
    E("Explain the prototype chain.", "It's how inheritance works.",
      "Each object has a hidden link to a prototype object. If a property isn't on the object, JS looks it up on the prototype, then its prototype, until `null`. That's how arrays get `map` from `Array.prototype`.",
      "Reads walk the chain; writes create own properties that shadow it. `this` in an inherited method is still the calling object. Classes and `extends` set up the same chain: `Child.prototype.__proto__ === Parent.prototype`. I'd distinguish an object's `[[Prototype]]` from a constructor's `prototype` property, and note that methods are shared on the prototype rather than copied per instance, which saves memory."),
    E("Explain event delegation.", "Putting events on the parent.",
      "Instead of attaching a listener to every child, attach one to a parent. Because events bubble, the parent receives clicks from children, and you use `event.target.closest()` to see which child was clicked. It's efficient and works for elements added later.",
      "I'd add the details that make it robust: use `closest` because the target may be a nested icon, check `currentTarget.contains` the match, use data attributes like `data-action` to route behaviour, and remember non-bubbling events like focus need `focusin`. It reduces memory and listener cleanup in large or dynamic lists like tables and chat feeds."),
    E("Explain debounce.", "It delays a function.",
      "Debounce makes a function run only after calls stop for a set time. Each call resets a timer. It's used for search inputs so you only call the API after the user pauses typing.",
      "Implementation is a closure over a timer with `clearTimeout` and `setTimeout`, preserving `this` and arguments. I'd discuss leading vs trailing options, a `cancel` method for unmount, and that debounce alone doesn't solve out-of-order responses: you still need AbortController or ignoring stale results."),
    E("Explain throttle.", "It limits a function.",
      "Throttle ensures a function runs at most once per interval, no matter how often it's triggered. Good for scroll, resize or mousemove handlers.",
      "Unlike debounce, it produces steady updates during continuous activity. A good implementation includes a trailing call so the final position isn't lost. For visual updates `requestAnimationFrame` is often a better throttle because it aligns with frames, and for visibility checks IntersectionObserver avoids scroll handlers altogether."),
    E("Explain shallow vs deep copy.", "Deep copy copies everything.",
      "A shallow copy duplicates top-level properties, but nested objects are still shared references. A deep copy duplicates every level. Spread and Object.assign are shallow; structuredClone is deep.",
      "I'd give the failure mode: mutating a nested field in a spread copy changes the original, a classic state bug. Trade-offs: `structuredClone` handles Dates, Maps, Sets and cycles but not functions or DOM nodes; JSON loses functions, undefined and Dates. In state management, prefer immutable updates that copy only the changed path rather than deep cloning everything."),
    E("Explain microtasks vs macrotasks.", "Microtasks are smaller.",
      "Microtasks are promise callbacks and code after await; macrotasks are timers, events and I/O callbacks. After each macrotask, the event loop runs all microtasks before moving on, so promises run before timers.",
      "Because the microtask queue is drained completely, microtasks added during draining also run before rendering or the next task. That gives promises predictable, fast scheduling but means an endless microtask chain blocks the UI. MutationObserver callbacks and `queueMicrotask` are also microtasks."),
    E("How is JavaScript single-threaded but asynchronous?", "It uses multiple threads.",
      "The JS engine executes on one thread with one call stack. The browser provides other threads for timers, networking and events. When those finish, they queue callbacks, and the event loop runs them when the stack is free.",
      "So concurrency comes from the host environment, not the language. JavaScript code never runs in parallel on the main thread, which removes data races in normal code, but it also means CPU-heavy work blocks everything. For true parallelism we use Web Workers, which have their own event loop and communicate by message passing."),
    E("Explain how browser events propagate.", "They bubble up.",
      "Events go through three phases: capturing from window down to the target, the target phase, then bubbling back up. Listeners default to bubbling; `capture: true` listens on the way down. stopPropagation halts the journey.",
      "I'd cover `target` vs `currentTarget`, events that don't bubble, listener options (`once`, `passive`, `signal`), and that `preventDefault` is separate from propagation. Practical uses: delegation on bubble, capture to intercept before children handle it, and passive listeners for scroll performance."),
    E("Explain CORS.", "It's a security error from the server.",
      "CORS lets a server allow cross-origin requests. Browsers block reading responses from another origin unless the server sends headers like `Access-Control-Allow-Origin`. Some requests trigger a preflight OPTIONS request first.",
      "It's an exception to the same-origin policy, enforced by the browser to protect users' data. Simple requests are sent directly; requests with custom headers, JSON bodies or methods like PUT get a preflight. Credentials need `credentials: include`, `Allow-Credentials: true` and an explicit origin. The fix is always server configuration or a same-origin proxy; `no-cors` just gives an unreadable opaque response."),

  blocks:[
    {t:"rev", title:"1. Fundamentals (4 min)", text:"- `var` function-scoped, hoisted as `undefined`. `let`/`const` block-scoped, TDZ. `const` blocks reassignment, not mutation.\n- Falsy: `false 0 -0 0n \"\" null undefined NaN`. `[]` and `{}` are truthy.\n- `==` converts (`null == undefined` only), `===` doesn't. `+` with a string concatenates; `- * /` convert to numbers.\n- `typeof null === \"object\"`, `typeof NaN === \"number\"`, use `Array.isArray`.\n- Primitives by value, objects by reference. `{} === {}` is false.\n- `??` keeps `0` and `\"\"`; `?.` stops at null/undefined."},
    {t:"rev", title:"2. Scope, closures, this (5 min)", text:"- Lexical scope: lookup walks outward from where code is written.\n- Closure: function + live references to its outer variables. Uses: privacy, factories, memoize, debounce.\n- `this`: `new` > `bind`/`call`/`apply` > `obj.method()` > plain call (`undefined` in strict).\n- Arrows have no own `this`, `arguments` or `new`. Don't use them as object methods.\n- `call(ctx, a, b)`, `apply(ctx, [a, b])`, `bind(ctx)` returns a function; bound `this` can't be rebound."},
    {t:"rev", title:"3. Prototypes and copying (3 min)", text:"- Property read walks `[[Prototype]]` up to `null`; writes create own properties.\n- `class` = function + prototype methods; strict, must use `new`, `super()` before `this`.\n- Shallow: spread, `Object.assign`, `slice`. Deep: `structuredClone` (no functions/DOM). JSON loses functions, undefined, Dates."},
    {t:"rev", title:"4. Arrays (3 min)", text:"- `map` transform, `filter` select, `reduce` accumulate (always pass initial), `find` first item, `some`/`every` booleans.\n- `forEach`: no return value, no break, ignores async.\n- `sort` mutates and sorts as strings: use `(a, b) => a - b`, copy first or `toSorted`.\n- `[\"1\",\"2\",\"3\"].map(parseInt)` → `[1, NaN, NaN]`."},
    {t:"rev", title:"5. Event loop and async (6 min)", text:"- One call stack. Web APIs do async work and queue callbacks.\n- Loop: run a macrotask → drain ALL microtasks → render → next macrotask.\n- Micro: `.then`, after `await`, `queueMicrotask`. Macro: `setTimeout`, events.\n- Promise executor is synchronous. `.then` returns a new promise; return or lose the chain.\n- `async` returns a promise; code before the first `await` is sync.\n- `fetch` rejects only on network error/abort: check `res.ok`.\n- `all` fail-fast, `allSettled` always, `race` first settled, `any` first fulfilled.\n- Parallel: `await Promise.all([a(), b()])`."},
    {t:"rev", title:"Must-know output", code:`console.log("A");
setTimeout(() => console.log("B"));
Promise.resolve().then(() => console.log("C"));
console.log("D");                          // A D C B

for (var i = 0; i < 3; i++) setTimeout(() => console.log(i)); // 3 3 3
for (let j = 0; j < 3; j++) setTimeout(() => console.log(j)); // 0 1 2`},
    {t:"rev", title:"6. DOM and browser (5 min)", text:"- Propagation: capture down, target, bubble up. `target` = origin, `currentTarget` = listener's element.\n- Delegation: one listener on the parent + `e.target.closest(sel)`. Works for dynamic items.\n- `preventDefault` stops browser action; `stopPropagation` stops travel.\n- `defer` ordered after parsing; `async` whenever ready. Modules defer.\n- Cookies sent to the server (use `HttpOnly; Secure; SameSite`); localStorage persists; sessionStorage per tab; strings only.\n- AbortController: `signal` in fetch, `abort()` to cancel, ignore `AbortError`.\n- CORS: browser-enforced, server fixes with `Access-Control-Allow-*`; non-simple requests preflight with OPTIONS.\n- IntersectionObserver for lazy load and infinite scroll; MutationObserver for DOM changes."},
    {t:"rev", title:"7. Senior topics (4 min)", text:"- Debounce: clear and reset timer; fire after the pause (search). Throttle: at most once per interval (scroll).\n- Stale responses: abort previous request or check a request ID.\n- Leaks: global listeners, intervals, detached DOM, unbounded caches, observers. Fix with cleanup, AbortController signals, WeakMap.\n- Performance: measure first; virtualize long lists; batch reads then writes; animate `transform`/`opacity`; Web Workers for heavy CPU.\n- Optimistic UI: update now, roll back on failure; not for payments.\n- Concurrency limits and in-flight request dedupe by caching the promise."},
    {t:"rev", title:"Interview-ready definitions", text:"- **Closure:** a function plus the lexical environment it was created in.\n- **Event loop:** runs a task, drains microtasks, renders, repeats, letting single-threaded JS handle async work.\n- **Promise:** an object for a future value that settles once, fulfilled or rejected.\n- **Prototype chain:** the linked lookup path objects use for inherited properties.\n- **Event delegation:** handling child events with one ancestor listener via bubbling.\n- **CORS:** server headers that let a browser expose cross-origin responses to page scripts.\n- **Debounce/throttle:** rate-limiting wrappers: after a pause / at most once per interval."}
